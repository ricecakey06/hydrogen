[package]
name = "hydrogen-plugin-services"
version = "1.0.0"
edition = "2024"
[dependencies]
hydrogen-plugin-sdk = { path = "../native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt","time","net","sync","fs","io-util","macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "=0.13.5", default-features = false }
sha1 = "0.10"
