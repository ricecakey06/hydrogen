[package]
name = "hydrogen-minecraft-instances"
version = "1.0.0"
edition = "2024"
license = "MIT"
[lib]
crate-type = ["cdylib"]
[dependencies]
hydrogen-plugin-sdk = { path = "../../plugin-sdk/native" }
hydrogen-plugin-services = { path = "../../plugin-sdk/services" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
reqwest = { version = "=0.13.5", default-features = false }
uuid = { version = "1", features = ["v4"] }
regex = "1"
zip = { version = "6", default-features = false, features = ["deflate"] }
dunce = "1"
tokio = { version = "1", features = ["rt"] }
