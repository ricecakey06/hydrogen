[package]
name = "hydrogen-account-manager"
version = "1.0.0"
edition = "2024"
license = "MIT"
[lib]
crate-type = ["cdylib"]
[dependencies]
hydrogen-plugin-sdk = { path = "../../plugin-sdk/native" }
hydrogen-plugin-services = { path = "../../plugin-sdk/services" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
