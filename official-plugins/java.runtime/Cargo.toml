[package]
name = "hydrogen-java-runtime"
version = "1.0.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
hydrogen-plugin-sdk = { path = "../../plugin-sdk/native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "io-util", "process", "macros", "sync"] }
