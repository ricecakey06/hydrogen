[package]
name = "hydrogen-credentials"
version = "1.0.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
hydrogen-plugin-sdk = { path = "../../plugin-sdk/native" }
base64 = "0.23"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_System_Memory"] }
