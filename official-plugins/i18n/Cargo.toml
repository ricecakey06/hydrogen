[package]
name = "hydrogen-i18n"
version = "1.0.0"
edition = "2024"
license = "MIT"
[lib]
crate-type = ["cdylib"]
[dependencies]
hydrogen-plugin-sdk = { path = "../../plugin-sdk/native" }
hydrogen-plugin-services = { path = "../../plugin-sdk/services" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
[dev-dependencies]
tempfile = "3"
