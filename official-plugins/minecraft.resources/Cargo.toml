[package]
name = "hydrogen-minecraft-resources"
version = "1.0.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
hydrogen-plugin-sdk = { path = "../../plugin-sdk/native" }
hydrogen-plugin-services = { path = "../../plugin-sdk/services" }
reqwest = { version = "=0.13.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
