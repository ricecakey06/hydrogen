[package]
name = "hydrogen-minecraft-mods"
version = "1.0.0"
edition = "2024"
license = "MIT"
[lib]
crate-type = ["cdylib"]
[dependencies]
hydrogen-plugin-sdk = { path = "../../plugin-sdk/native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
sha1 = "0.10"
uuid = { version = "1", features = ["v4"] }
toml = "1"
zip = { version = "6", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["rt", "fs", "io-util"] }
