[package]
name = "hydrogen-minecraft-preinstall"
version = "1.0.0"
edition = "2024"
license = "MIT"
[lib]
crate-type = ["cdylib"]
[dependencies]
hydrogen-plugin-sdk = { path = "../../plugin-sdk/native" }
hydrogen-plugin-services = { path = "../../plugin-sdk/services" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
reqwest = { version = "=0.13.5", default-features = false }
tokio = { version = "1", features = ["fs","sync"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
