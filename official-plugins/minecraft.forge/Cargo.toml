[package]
name = "hydrogen-minecraft-forge"
version = "1.0.0"
edition = "2024"
license = "MIT"
[lib]
crate-type = ["cdylib"]
[dependencies]
hydrogen-plugin-sdk = { path = "../../plugin-sdk/native" }
hydrogen-plugin-services = { path = "../../plugin-sdk/services" }
serde_json = "1"
regex = "1"
zip = { version = "6", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["time"] }
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
[dev-dependencies]
tempfile = "3"
