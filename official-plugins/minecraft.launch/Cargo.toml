[package]
name = "hydrogen-minecraft-launch"
version = "1.0.0"
edition = "2024"
license = "MIT"
[lib]
crate-type = ["cdylib"]
[dependencies]
hydrogen-plugin-sdk = { path = "../../plugin-sdk/native" }
hydrogen-plugin-services = { path = "../../plugin-sdk/services" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
reqwest = { version = "=0.13.5", default-features = false }
base64 = "0.23"
regex = "1"
tokio = { version = "1", features = ["time"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
