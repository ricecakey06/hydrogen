[package]
name = "hydrogen-minecraft-download"
version = "1.0.0"
edition = "2024"
license = "MIT"
[lib]
crate-type = ["cdylib"]
[dependencies]
hydrogen-plugin-sdk = { path = "../../plugin-sdk/native" }
hydrogen-plugin-services = { path = "../../plugin-sdk/services" }
serde_json = "1"
sha1 = "0.10"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt","time","fs","sync","io-util","macros"] }
reqwest = { version = "=0.13.5", default-features = false }
httpdate = "1"
futures-util = "0.3"
[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
