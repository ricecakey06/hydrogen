[package]
name = "hydrogen-network"
version = "1.0.0"
edition = "2024"
license = "MIT"
[lib]
crate-type = ["cdylib"]
[dependencies]
hydrogen-plugin-sdk = { path = "../../plugin-sdk/native" }
serde_json = "1"
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread","time","net","macros"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls","json","form","stream","query","system-proxy","gzip"] }
