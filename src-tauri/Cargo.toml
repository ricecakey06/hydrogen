[package]
name = "hydrogen-launcher"
version = "0.2.7"
description = "Hydrogen desktop launcher for Minecraft: Java Edition"
edition = "2024"
license = "MIT"
default-run = "Launcher"

[lib]
name = "hydrogen"

[[bin]]
name = "Launcher"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "hydrogen-dev"
path = "src/bin/hydrogen-dev.rs"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:windows-sys", "dep:webview2-com", "dep:windows"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
serde_json = "1"
zip = { version = "6", default-features = false, features = ["deflate"] }
tauri-build = { version = "=2.7.4", features = [], optional = true }

[dependencies]
hydrogen-plugin-sdk = { path = "../plugin-sdk/native" }
tauri = { version = "=2.12.5", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "loader"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util", "net", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "json", "stream", "form", "query", "system-proxy"] }
sha1 = "0.10"
base64 = "0.23"
regex = "1"
futures-util = "0.3"
httpdate = "1"
toml = "1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
semver = "1"
dunce = "1"
lightningcss = { version = "1.0.0-alpha.72", default-features = false, features = ["visitor", "into_owned"] }
static-self = "0.1"
cssparser = "0.33"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
zip = { version = "6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"], optional = true }
webview2-com = { version = "=0.39.1", optional = true }
windows = { version = "0.62", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
# Keep per-call integrity verification usable for streamed native services in debug builds.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.digest]
opt-level = 3
[profile.dev.package.block-buffer]
opt-level = 3
[profile.dev.package.crypto-common]
opt-level = 3
