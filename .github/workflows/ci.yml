name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Build and test (${{ matrix.os }})
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Select a temporary directory without linked ancestors
        # macOS's system temp path uses /var symlinks, which the filesystem guards reject.
        run: |
          temporary=$(cd "$RUNNER_TEMP" && pwd -P)
          if [[ "$RUNNER_OS" == "Windows" ]]; then temporary=$(cygpath -m "$temporary"); fi
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$temporary" "$temporary" "$temporary" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - name: Restore frontend dependencies
        run: npm ci
      - name: Check and build frontend packages
        run: npm run build
      - name: Run frontend tests
        run: npm test
      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo fmt --manifest-path official-plugins/Cargo.toml --all --check
          cargo fmt --manifest-path plugin-sdk/native/Cargo.toml --check
      - name: Build native plugins
        run: cargo build --manifest-path official-plugins/Cargo.toml --locked
      - name: Test native plugins
        run: cargo test --manifest-path official-plugins/Cargo.toml --workspace --locked
      - name: Test plugin SDKs
        run: cargo test --manifest-path official-plugins/Cargo.toml --locked -p hydrogen-plugin-sdk -p hydrogen-plugin-services
      - name: Test host without desktop dependencies
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-default-features --no-fail-fast
      - name: Test desktop integration
        if: runner.os == 'Windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --no-fail-fast

  windows-package:
    name: Package Windows x64
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Restore frontend dependencies
        run: npm ci
      - name: Build frontend packages
        run: npm run build
      - name: Build Release plugins
        env:
          HYDROGEN_MICROSOFT_CLIENT_ID: ${{ github.ref == 'refs/heads/tauri' && github.event_name != 'pull_request' && secrets.HYDROGEN_MICROSOFT_CLIENT_ID || '' }}
          HYDROGEN_CURSEFORGE_API_KEY: ${{ github.ref == 'refs/heads/tauri' && github.event_name != 'pull_request' && secrets.HYDROGEN_CURSEFORGE_API_KEY || '' }}
        run: cargo build --manifest-path official-plugins/Cargo.toml --release --locked
      - name: Build standalone executable
        id: executable
        env:
          HYDROGEN_MICROSOFT_CLIENT_ID: ${{ github.ref == 'refs/heads/tauri' && github.event_name != 'pull_request' && secrets.HYDROGEN_MICROSOFT_CLIENT_ID || '' }}
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --locked --features custom-protocol --bin Launcher
      - name: Check packaged startup and bundled plugins
        shell: pwsh
        run: |
          $exe = (Resolve-Path -LiteralPath src-tauri/target/release/Launcher.exe).Path
          $probe = Join-Path $env:RUNNER_TEMP 'hydrogen-startup'
          New-Item -ItemType Directory -Path $probe | Out-Null
          Copy-Item -LiteralPath $exe -Destination (Join-Path $probe 'Launcher.exe')
          $env:RUST_BACKTRACE = '1'
          $startedAt = Get-Date
          $check = Start-Process -FilePath $exe -ArgumentList '--check' -WindowStyle Hidden -PassThru -RedirectStandardOutput (Join-Path $probe 'check-stdout.log') -RedirectStandardError (Join-Path $probe 'check-stderr.log')
          if (-not $check.WaitForExit(30000)) {
            Stop-Process -Id $check.Id -ErrorAction SilentlyContinue
            throw 'Packaged startup check timed out.'
          }
          if ($check.ExitCode -ne 0) {
            Get-Content -LiteralPath (Join-Path $probe 'check-stderr.log') -ErrorAction SilentlyContinue
            throw "Packaged startup check failed with exit code $($check.ExitCode)."
          }

          # --check only checks WebView2; start the packaged UI to verify plugin deployment.
          $ready = Join-Path $probe 'ready.json'
          $arguments = @('--data-dir', "`"$probe/data`"", '--benchmark-ready-file', "`"$ready`"", '--benchmark-webview-data', "`"$probe/webview`"")
          $process = Start-Process -FilePath $exe -ArgumentList $arguments -WindowStyle Hidden -PassThru -RedirectStandardOutput (Join-Path $probe 'stdout.log') -RedirectStandardError (Join-Path $probe 'stderr.log')
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(60)
            while (-not (Test-Path -LiteralPath $ready)) {
              if ($process.HasExited) {
                $process.WaitForExit()
                throw "Packaged UI exited before becoming ready with exit code $($process.ExitCode)."
              }
              if ([DateTime]::UtcNow -ge $deadline) { throw 'Packaged UI startup timed out.' }
              Start-Sleep -Milliseconds 250
            }
            $null = Get-Content -LiteralPath $ready -Raw | ConvertFrom-Json
            $index = Get-Content -LiteralPath official-plugins/distribution.json -Raw | ConvertFrom-Json
            foreach ($id in $index.PSObject.Properties.Name) {
              $plugin = Join-Path $probe "data/plugins/$id"
              $manifest = Get-Content -LiteralPath (Join-Path $plugin 'plugin.json') -Raw | ConvertFrom-Json
              if (-not (Test-Path -LiteralPath (Join-Path $plugin $manifest.entry) -PathType Leaf)) {
                throw "Bundled plugin entry is missing: $id"
              }
            }
          } catch {
            $failure = $_
            Get-Content -LiteralPath (Join-Path $probe 'stdout.log'),(Join-Path $probe 'stderr.log') -Tail 80 -ErrorAction SilentlyContinue
            try {
              Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$startedAt; Id=1000,1001} -MaxEvents 20 -ErrorAction Stop |
                Where-Object { $_.Message -match 'Launcher\.exe|msedgewebview2\.exe' } |
                Select-Object TimeCreated,Id,ProviderName,Message |
                ConvertTo-Json -Depth 3 |
                Tee-Object -FilePath (Join-Path $probe 'events.json')
            } catch { Write-Warning "Application event diagnostics unavailable: $($_.Exception.Message)" }
            throw $failure
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -ErrorAction SilentlyContinue }
          }
      - name: Upload startup failure diagnostics
        if: failure() && steps.executable.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: Hydrogen-startup-diagnostics
          path: |
            ${{ runner.temp }}/hydrogen-startup/*.log
            ${{ runner.temp }}/hydrogen-startup/*.json
            ${{ runner.temp }}/hydrogen-startup/Launcher.exe
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: Hydrogen-win-x64
          path: src-tauri/target/release/Launcher.exe
          if-no-files-found: error
          retention-days: 14
